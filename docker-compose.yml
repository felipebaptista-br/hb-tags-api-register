services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hbtags
      POSTGRES_PASSWORD: hbtags
      POSTGRES_DB: hbtags
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hbtags -d hbtags"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgres://hbtags:hbtags@postgres:5432/hbtags?sslmode=disable
      ADMIN_API_KEY: dev-admin-key
      APP_URL: http://localhost:3000
      FRONTEND_ORIGIN: http://localhost:3000
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
